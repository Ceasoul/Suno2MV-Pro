<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8" />
<title>词影 · MV 工作台</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>
  /* 词影 visual language: ink black, jade, gilded gold. */
  :root { color-scheme: dark; --bg:#0e110f; --panel:#151a16; --panel2:#1c221d; --line:#29322b; --fg:#e8ece4; --dim:#8b978d; --jade:#2fbf8a; --jade-d:#1d6b50; --gold:#dfb055; --warn:#e8964a; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); font: 14px/1.55 "Microsoft YaHei", "PingFang SC", system-ui, sans-serif; overflow: hidden; }
  button, select, input, textarea { font: inherit; color: var(--fg); background: var(--panel2); border: 1px solid var(--line); border-radius: 4px; padding: 5px 10px; }
  button { cursor: pointer; } button:hover { border-color: var(--jade); } button:disabled { opacity: .45; cursor: default; }
  button.primary { background: var(--jade); border-color: var(--jade); color: #06140e; font-weight: 700; }
  button.gold { background: transparent; border-color: var(--gold); color: var(--gold); }
  textarea { width: 100%; resize: vertical; min-height: 54px; }
  #app { display: grid; grid-template-rows: 46px minmax(0, 1fr) 176px; height: 100vh; }
  header { display: flex; align-items: center; gap: 14px; padding: 0 14px; background: linear-gradient(90deg, #102019, var(--bg) 40%); border-bottom: 1px solid var(--line); }
  .brand { display: flex; align-items: baseline; gap: 8px; } .brand .zh { font: 900 20px "Microsoft YaHei"; color: var(--gold); letter-spacing: 3px; } .brand .en { font-size: 11px; color: var(--dim); letter-spacing: 1px; }
  header .title { color: var(--dim); margin-right: auto; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #status { font-size: 12px; color: var(--dim); } #status.ok { color: var(--jade); } #status.bad { color: var(--warn); }
  #exportBox { font-size: 12px; color: var(--dim); min-width: 110px; }
  main { display: grid; grid-template-columns: 76px 400px minmax(0, 1fr); min-height: 0; }
  nav { display: flex; flex-direction: column; gap: 4px; padding: 10px 6px; border-right: 1px solid var(--line); background: #0b0e0c; }
  nav button { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 10px 0; border: 0; border-left: 3px solid transparent; border-radius: 0; background: none; color: var(--dim); font-size: 12px; }
  nav button .ic { font-size: 20px; line-height: 1; } nav button.on { color: var(--jade); border-left-color: var(--jade); background: #13201a; }
  #panel { border-right: 1px solid var(--line); overflow: auto; padding: 14px; }
  .pane { display: none; } .pane.on { display: block; }
  .pane > h2 { margin: 0 0 12px; font-size: 16px; color: var(--gold); letter-spacing: 2px; }
  .group { border-top: 1px solid var(--line); padding: 12px 0 4px; }
  .group h3 { margin: 0 0 8px; font-size: 13px; color: var(--fg); display: flex; align-items: center; gap: 8px; }
  .row { display: flex; align-items: center; gap: 10px; margin: 8px 0; flex-wrap: wrap; }
  .row > label:first-child { color: var(--dim); min-width: 70px; }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 4px; overflow: hidden; }
  .seg button { border: 0; border-radius: 0; background: var(--panel2); padding: 4px 10px; } .seg button.on { background: var(--jade-d); color: #fff; }
  .chip { padding: 2px 10px; border-radius: 3px; font-size: 12px; } .chip.on { background: var(--jade-d); border-color: var(--jade); color: #fff; }
  .swatch { width: 24px; height: 24px; border-radius: 3px; padding: 0; border: 2px solid transparent; transform: rotate(45deg) scale(.8); } .swatch.on { border-color: #fff; }
  .hint { font-size: 12px; color: var(--dim); }
  .note { font-size: 12px; color: var(--dim); background: #111814; border: 1px dashed var(--jade-d); border-radius: 4px; padding: 8px 10px; margin: 8px 0; }
  .note code { color: var(--gold); }
  .sec { border-left: 3px solid var(--line); padding: 8px 0 8px 10px; margin: 10px 0; }
  .sec.sel { border-left-color: var(--gold); background: #141b16; }
  .sec .hd { display: flex; align-items: center; gap: 8px; }
  .sec .hd .name { font-weight: 700; cursor: pointer; } .sec .hd .t { font: 12px monospace; color: var(--dim); margin-right: auto; }
  .sec .ly { font-size: 12px; color: var(--dim); margin: 4px 0 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .thumbs { display: flex; gap: 6px; flex-wrap: wrap; }
  .thumb { position: relative; width: 104px; aspect-ratio: 16/9; border-radius: 3px; overflow: hidden; background: #000 center/cover; border: 1px solid var(--line); }
  .thumb .x { position: absolute; top: 2px; right: 2px; padding: 0 6px; font-size: 12px; background: #000b; }
  .thumb .tag { position: absolute; left: 0; right: 0; bottom: 0; font-size: 10px; color: #fff; background: linear-gradient(transparent, #000c); padding: 6px 4px 1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .packs { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
  .pack { border-radius: 4px; padding: 12px 8px; font-weight: 800; border: 2px solid transparent; cursor: pointer; display: flex; justify-content: space-between; align-items: center; }
  .pack small { font-weight: 400; font-size: 11px; } .pack.on { border-color: var(--gold); }
  #stageWrap { display: flex; flex-direction: column; min-height: 0; padding: 12px; gap: 8px; }
  #stage { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; background: repeating-linear-gradient(45deg, #0b0e0c 0 12px, #0d110e 12px 24px); border: 1px solid var(--line); }
  #c { max-width: 100%; max-height: 100%; aspect-ratio: 16/9; cursor: pointer; box-shadow: 0 0 0 1px #000, 0 10px 40px #000a; }
  #transport { display: flex; align-items: center; gap: 10px; }
  #transport .time { font: 13px monospace; color: var(--gold); min-width: 130px; }
  #scrub { flex: 1; accent-color: var(--jade); }
  #tl { position: relative; border-top: 1px solid var(--line); background: #0a0d0b; }
  #tlc { width: 100%; height: 100%; display: block; cursor: pointer; }
  .busy { opacity: .55; pointer-events: none; }
  dialog { background: var(--panel); color: var(--fg); border: 1px solid var(--jade-d); border-radius: 6px; width: min(900px, 90vw); }
  dialog textarea { min-height: 50vh; font: 12px/1.5 monospace; }
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="brand"><span class="zh">词影</span><span class="en">SunoLyricSync · MV 工作台</span></div>
    <select id="song"></select>
    <div class="title" id="title"></div>
    <span id="status"></span>
    <button id="exportBtn" class="primary">导出视频</button>
    <span id="exportBox"></span>
  </header>
  <main>
    <nav>
      <button data-tab="story" class="on"><span class="ic">🎞</span>段落画面</button>
      <button data-tab="sub"><span class="ic">字</span>字幕</button>
      <button data-tab="pv"><span class="ic">✦</span>文字 PV</button>
      <button data-tab="info"><span class="ic">ⓘ</span>标题信息</button>
    </nav>
    <div id="panel">
      <div class="pane on" id="pane-story"></div>
      <div class="pane" id="pane-sub"></div>
      <div class="pane" id="pane-pv"></div>
      <div class="pane" id="pane-info"></div>
    </div>
    <section id="stageWrap">
      <div id="stage"><canvas id="c"></canvas></div>
      <div id="transport">
        <button id="play">▶ 播放</button>
        <span class="time" id="time">0:00.0 / 0:00</span>
        <input id="scrub" type="range" min="0" value="0" step="0.01" />
        <select id="rate"><option>0.5</option><option>0.75</option><option selected>1</option><option>1.25</option><option>1.5</option><option>2</option></select>
        <label class="hint"><input type="checkbox" id="loop" /> 循环本段</label>
      </div>
    </section>
  </main>
  <div id="tl"><canvas id="tlc"></canvas></div>
</div>
<dialog id="dlg"><h3 id="dlgTitle"></h3><div class="hint" id="dlgHint"></div><textarea id="dlgText" readonly></textarea><div class="row"><button id="dlgCopy" class="primary">复制</button><button id="dlgClose">关闭</button></div></dialog>
<script type="module" src="/src/editor/main.ts"></script>
</body>
</html>
